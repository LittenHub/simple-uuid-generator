<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UUID v4 Generator</title>
    <style>
        /* --- GAYA DASAR & WARNA --- */
        body {
            background-color: #030619; 
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Badge paling atas */
        .top-badge {
            background-color: #091023;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 16px;
            border-radius: 10px;
            font-size: 12px;
            color: #94a3b8;
            box-shadow: 0 0px 40px rgba(80, 80, 80, 0.4);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            animation: fadeIn 1.0s ease forwards;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 10px 0;
            text-align: center;
            animation: fadeInDown 1.5s ease forwards;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            text-align: center;
            max-width: 340px;
            margin: 0 0 30px 0;
            line-height: 1.4;
            animation: fadeInUp 2.0s ease forwards;
        }

        /* Kotak Utama / Card */
        .container {
            background-color: #070E21;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 20px 40px rgba(60, 60, 60, 0.6);
            box-sizing: border-box;
            animation: fadeIn 0.5s ease forwards;
        }

        /* Group Input Jumlah */
        .input-group {
            margin-bottom: 20px;
        }

        .input-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .input-label {
            font-size: 11px;
            font-weight: 600;
            color: #475569;
            letter-spacing: 0.5px;
        }

        .max-label {
            font-size: 12px;
            color: #475569;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            background-color: #070a13;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 500;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        /* --- JENDELA EDITOR (STYLE MACOS) --- */
        .editor-box {
            background-color: #070a13;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .editor-header {
            background-color: #131A2C;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mac-dots {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .dot.red { background-color: #ef4444; }
        .dot.yellow { background-color: #f59e0b; }
        .dot.green { background-color: #10b981; }

        .file-name {
            font-size: 12px;
            color: #64748b;
            font-family: monospace;
        }

        .copy-all-btn {
            background: none;
            border: none;
            color: #64748b;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .copy-all-btn:hover {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* Container tempat UUID */
        #output-container {
            min-height: 160px; /* Menjaga tinggi kotak saat kosong/awal dibuka */
            max-height: 240px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        /* Gaya untuk Teks Placeholder di Tengah (FITUR BARU) */
        .placeholder-text {
            margin: auto; /* Trik Flexbox sakti untuk membuat elemen tepat di tengah */
            color: #475569;
            font-size: 14px;
            text-align: center;
            font-family: sans-serif;
            letter-spacing: 0.3px;
            animation: fadeIn 1.5s ease forwards;
        }

        .placeholder-text strong {
            color: #94a3b8;
            font-weight: 600;
        }

        /* Kustomisasi Scrollbar */
        #output-container::-webkit-scrollbar { width: 4px; }
        #output-container::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px); /* Muncul sedikit dari bawah */
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-12px); /* Muncul sedikit dari bawah */
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Baris UUID ketika muncul */
        .uuid-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            gap: 10px;
            
            opacity: 0; /* Mulai dari transparan sebelum animasi jalan */
            animation: fadeInUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .line-number {
            font-family: monospace;
            font-size: 13px;
            color: #334155;
            min-width: 15px;
            text-align: right;
        }

        .uuid-text {
            font-family: monospace;
            font-size: 13px;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-grow: 1;
        }

        /* Tombol Copy per baris */
        .copy-row-btn {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #94a3b8;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .copy-row-btn:hover {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.08);
        }

        /* --- TOMBOL UTAMA GENERATE (PUTIH CERAH) --- */
        #generate-btn {
            width: 100%;
            padding: 14px;
            background-color: #E1E8F0; 
            color: #0f172a; 
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        #generate-btn:hover {
            background-color: #ffffff;
        }
        
        #generate-btn:active {
            transform: scale(0.98); 
        }

        /* Footer bawah */
        .footer-text {
            margin-top: 25px;
            font-size: 12px;
            font-family: monospace;
            color: #334155;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>UUID v4 Generator</h1>
    <p class="subtitle">Generate random RFC 4122 v4 UUIDs and copy them in one click.</p>

    <div class="container">
        
        <div class="input-group">
            <div class="input-label-row">
                <span class="input-label">JUMLAH UUID</span>
                <span class="max-label">max 100</span>
            </div>
            <input type="number" id="count" value="1" min="1" max="100">
        </div>

        <div class="editor-box">
            <div class="editor-header">
                <div class="mac-dots">
                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>
                </div>
                <div class="file-name">uuid-v4.txt</div>
                <button class="copy-all-btn" id="copy-all-btn">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                    Copy all
                </button>
            </div>
            
            <div id="output-container">
                <div class="placeholder-text">Klik <strong>Generate UUID</strong> untuk mulai.</div>
            </div>
        </div>

        <button id="generate-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
            Generate UUID
        </button>

    </div>

    <div class="footer-text">Built with crypto.randomUUID()</div>

    <script>
        /* --- LOGIKA JAVASCRIPT --- */
        const generateBtn = document.getElementById('generate-btn');
        const outputContainer = document.getElementById('output-container');
        const countInput = document.getElementById('count');
        const copyAllBtn = document.getElementById('copy-all-btn');
        
        let currentUUIDs = [];

        function generateUUIDv4() {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                return crypto.randomUUID();
            }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                let r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        function renderUUIDs() {
            // Menghapus isi container (termasuk teks placeholder awal)
            outputContainer.innerHTML = '';
            currentUUIDs = [];

            let count = parseInt(countInput.value) || 1;
            if (count < 1) count = 1;
            if (count > 100) count = 100;
            countInput.value = count;

            for (let i = 0; i < count; i++) {
                const newUUID = generateUUIDv4();
                currentUUIDs.push(newUUID);

                const row = document.createElement('div');
                row.className = 'uuid-row';
                row.style.animationDelay = `${i * 0.03}s`;

                const lineNum = document.createElement('span');
                lineNum.className = 'line-number';
                lineNum.textContent = i + 1;

                const textSpan = document.createElement('span');
                textSpan.className = 'uuid-text';
                textSpan.textContent = newUUID;

                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-row-btn';
                copyBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg> Copy`;
                
                copyBtn.onclick = function() {
                    navigator.clipboard.writeText(newUUID);
                    this.textContent = 'Copied!';
                    setTimeout(() => {
                        this.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg> Copy`;
                    }, 1500);
                };

                row.appendChild(lineNum);
                row.appendChild(textSpan);
                row.appendChild(copyBtn);
                outputContainer.appendChild(row);
            }
        }

        // --- CATATAN: Fungsi renderUUIDs() di sini TIDAK dipanggil langsung agar halaman awal kosong ---

        // Tombol generate diklik
        generateBtn.addEventListener('click', renderUUIDs);

        // Fitur tombol Copy All
        copyAllBtn.addEventListener('click', function() {
            if (currentUUIDs.length === 0) return;
            const allText = currentUUIDs.join('\n');
            navigator.clipboard.writeText(allText);
            
            const originalText = this.innerHTML;
            this.textContent = 'Copied All!';
            setTimeout(() => {
                this.innerHTML = originalText;
            }, 1500);
        });
    </script>
</body>
</html>
